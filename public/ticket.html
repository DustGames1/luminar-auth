<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="https://i.imgur.com/ZRocgLJ.png" type="image/png">
<title>Ticket — Luminar</title>
<link rel="stylesheet" href="/style.css">
<style>
.ticket-container{max-width:900px;margin:80px auto 40px;padding:0 20px;}
.ticket-header{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;}
.ticket-title{font-size:24px;font-weight:700;margin-bottom:12px;}
.ticket-meta{display:flex;gap:16px;font-size:13px;color:var(--text-3);flex-wrap:wrap;}
.ticket-meta-item{display:flex;align-items:center;gap:6px;}
.status-badge{padding:4px 12px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;}
.status-badge.open{background:var(--green);color:#000;}
.status-badge.closed{background:var(--text-3);color:#000;}
.status-badge.answered{background:var(--purple);color:#fff;}
.messages-container{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;}
.message{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.message:last-child{margin-bottom:0;}
.message-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.message-author{font-weight:700;font-size:14px;}
.message-author.admin{color:var(--purple);}
.message-time{font-size:12px;color:var(--text-3);}
.message-body{font-size:14px;line-height:1.6;white-space:pre-wrap;}
.reply-form{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;}
.reply-form h3{font-size:18px;margin-bottom:16px;}
.reply-form textarea{width:100%;min-height:120px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;resize:vertical;}
.reply-form button{margin-top:12px;padding:12px 24px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.reply-form button:hover{opacity:0.9;}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:20px;transition:all 0.2s;}
.back-btn:hover{background:var(--surface-2);transform:translateX(-2px);}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-brand"><img src="https://i.imgur.com/ZRocgLJ.png" class="nav-brand-icon" alt="L"> Luminar</a>
  <div class="nav-center"><a href="/">Home</a><a href="/buy">Products</a><a href="https://t.me/offersheart" target="_blank">Telegram</a></div>
  <div class="nav-right"><button class="theme-toggle" onclick="toggleTheme()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button><a href="/profile" class="btn btn-purple" id="navUser">Profile</a></div>
</nav>

<div class="ticket-container">
  <a href="/tickets" class="back-btn">← Назад к тикетам</a>

  <div class="ticket-header">
    <div class="ticket-title" id="ticketTitle">Загрузка...</div>
    <div class="ticket-meta">
      <div class="ticket-meta-item">
        <span>Тикет:</span>
        <span id="ticketId">#—</span>
      </div>
      <div class="ticket-meta-item">
        <span>Статус:</span>
        <span class="status-badge" id="ticketStatus">—</span>
      </div>
      <div class="ticket-meta-item">
        <span>Создан:</span>
        <span id="ticketCreated">—</span>
      </div>
    </div>
  </div>

  <div class="messages-container">
    <div id="messagesContent">Загрузка сообщений...</div>
  </div>

  <div class="reply-form">
    <h3>Ответить</h3>
    <form id="replyForm" onsubmit="sendReply(event)">
      <textarea id="replyMessage" placeholder="Напишите ваш ответ..." required maxlength="2000"></textarea>
      <button type="submit">Отправить</button>
      <div id="replyMsg" class="form-msg" style="margin-top:12px;"></div>
    </form>
  </div>
</div>

<footer class="footer">
  <div class="footer-grid">
    <div class="footer-col"><h4>📄 Pages</h4><a href="/">Home</a><a href="/buy">Products</a></div>
    <div class="footer-col"><h4>💬 Communicate</h4><a href="https://t.me/offersheart">Telegram</a></div>
    <div class="footer-col"><h4>🔐 Account</h4><a href="/profile">Profile</a><a href="/login">Sign In</a></div>
  </div>
  <div class="footer-bottom"><span>© Luminar, 2026</span><span>All Rights Reserved</span></div>
</footer>

<script>
function toggleTheme(){const t=document.documentElement;t.dataset.theme=t.dataset.theme==='light'?'':'light';localStorage.setItem('theme',t.dataset.theme);const btn=document.querySelector('.theme-toggle');btn.innerHTML=t.dataset.theme==='light'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';}
if(localStorage.getItem('theme')==='light'){document.documentElement.dataset.theme='light';document.querySelector('.theme-toggle').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';}

const token=localStorage.getItem('luminar_token');
if(!token)location.href='/login';

const ticketId=window.location.pathname.split('/').pop();

async function loadTicket(){
  try{
    const r=await fetch(`/api/tickets/${ticketId}`,{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok){
      if(r.status===404){
        document.getElementById('ticketTitle').textContent='Тикет не найден';
        document.getElementById('messagesContent').innerHTML='<div style="text-align:center;padding:40px;color:var(--text-3);">Тикет не найден или у вас нет доступа</div>';
        return;
      }
      throw new Error('Failed to load');
    }
    const data=await r.json();
    
    // Update header
    document.getElementById('ticketTitle').textContent=data.ticket.title;
    document.getElementById('ticketId').textContent='#'+data.ticket.id;
    document.getElementById('ticketCreated').textContent=new Date(Number(data.ticket.created_at)).toLocaleDateString();
    
    const statusEl=document.getElementById('ticketStatus');
    statusEl.className='status-badge '+data.ticket.status;
    statusEl.textContent=getStatusText(data.ticket.status);
    
    // Render messages
    renderMessages(data.messages);
  }catch(e){
    console.error(e);
    document.getElementById('messagesContent').innerHTML='<div style="text-align:center;padding:40px;color:var(--danger);">Ошибка загрузки</div>';
  }
}

function renderMessages(messages){
  const container=document.getElementById('messagesContent');
  if(!messages||messages.length===0){
    container.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-3);">Нет сообщений</div>';
    return;
  }
  
  container.innerHTML=messages.map(m=>`
    <div class="message">
      <div class="message-header">
        <div class="message-author ${m.is_admin?'admin':''}">${m.username}${m.is_admin?' (Поддержка)':''}</div>
        <div class="message-time">${new Date(Number(m.created_at)).toLocaleString()}</div>
      </div>
      <div class="message-body">${escapeHtml(m.message)}</div>
    </div>
  `).join('');
}

function getStatusText(status){
  if(status==='open')return 'Открыт';
  if(status==='answered')return 'Отвечен';
  if(status==='closed')return 'Закрыт';
  return status;
}

function escapeHtml(text){
  const div=document.createElement('div');
  div.textContent=text;
  return div.innerHTML;
}

async function sendReply(e){
  e.preventDefault();
  const msg=document.getElementById('replyMsg');
  const message=document.getElementById('replyMessage').value.trim();
  
  if(!message){
    msg.className='form-msg err';
    msg.textContent='Введите сообщение';
    return;
  }
  
  try{
    const r=await fetch(`/api/tickets/${ticketId}/reply`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({message})
    });
    
    if(r.ok){
      msg.className='form-msg ok';
      msg.textContent='Ответ отправлен!';
      document.getElementById('replyMessage').value='';
      setTimeout(()=>{
        loadTicket();
        msg.textContent='';
      },1000);
    }else{
      const data=await r.json();
      msg.className='form-msg err';
      msg.textContent=data.error||'Ошибка';
    }
  }catch(e){
    msg.className='form-msg err';
    msg.textContent='Ошибка сервера';
  }
}

loadTicket();
</script>
</body>
</html>
