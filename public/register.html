<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Регистрация — Luminar</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="navbar"><div class="navbar-inner"><a href="/" class="navbar-brand"><span class="navbar-brand-icon">L</span> Luminar</a><nav class="navbar-links"><a href="/">Главная</a><a href="/buy">Магазин</a></nav><div class="navbar-actions"><a href="/login" class="btn btn-secondary btn-sm">Войти</a></div></div></div>
<div class="auth-page"><div class="auth-card">
  <h2>Регистрация</h2><p class="auth-sub">Создайте аккаунт Luminar</p>
  <div class="auth-switch"><a href="/login">Вход</a><a href="/register" class="active">Регистрация</a></div>
  <form id="f">
    <div class="form-field"><label>Логин</label><input class="form-input" type="text" id="username" placeholder="3-16 символов" required></div>
    <div class="form-field"><label>Пароль</label><input class="form-input" type="password" id="password" placeholder="Минимум 6 символов" required></div>
    <div class="form-field"><label>Повтор пароля</label><input class="form-input" type="password" id="password2" placeholder="••••••••" required></div>
    <button type="submit" class="btn btn-primary btn-block btn-lg">Создать аккаунт</button>
    <div id="msg" class="form-msg"></div>
  </form>
</div></div>
<script>
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.className='form-msg';
const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,p2=document.getElementById('password2').value;
if(p!==p2){msg.className='form-msg error';msg.textContent='Пароли не совпадают';return;}
try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const d=await r.json();
if(r.ok){localStorage.setItem('luminar_token',d.token);msg.className='form-msg success';msg.textContent='Создан!';setTimeout(()=>location.href='/buy',500);}
else{msg.className='form-msg error';msg.textContent=d.error||'Ошибка';}}catch{msg.className='form-msg error';msg.textContent='Ошибка сети';}});
</script>
</body></html>
