<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — LUMINAR</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="nav-line">
  <a href="/" class="brand">LUMINAR</a>
  <div class="links"><a href="/">Home</a><a href="/buy">Store</a></div>
  <div class="right"><a href="/login" class="btn btn-ghost">Login</a></div>
</div>

<div class="auth-full">
  <div class="auth-panel">
    <h2>REGISTER</h2>
    <p class="sub">Create your account</p>
    <div class="auth-tabs">
      <a href="/login">Login</a>
      <a href="/register" class="on">Register</a>
    </div>
    <form id="f">
      <div class="inp-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="3-16 chars, a-z 0-9 _" required autocomplete="username">
      </div>
      <div class="inp-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="min 6 characters" required autocomplete="new-password">
      </div>
      <div class="inp-group">
        <label>Confirm</label>
        <input type="password" id="password2" placeholder="••••••••" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-neon btn-block btn-lg">Create Account</button>
      <div id="msg" class="auth-msg"></div>
    </form>
  </div>
</div>

<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'auth-msg';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;
  if (password !== p2) { msg.className='auth-msg err'; msg.textContent='Passwords mismatch'; return; }
  try {
    const r = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password}) });
    const d = await r.json();
    if (r.ok) { localStorage.setItem('luminar_token',d.token); msg.className='auth-msg ok'; msg.textContent='Created!'; setTimeout(()=>location.href='/buy',400); }
    else { msg.className='auth-msg err'; msg.textContent=d.error||'Error'; }
  } catch { msg.className='auth-msg err'; msg.textContent='Network error'; }
});
</script>
</body>
</html>
