<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — Luminar</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
  <a href="/" class="logo">
    <span class="logo-icon">L</span>
    Luminar
  </a>
  <div class="links">
    <a href="/">Главная</a>
    <a href="/buy">Тарифы</a>
  </div>
  <div class="auth-btns">
    <a href="/login" class="btn btn-secondary">Войти</a>
    <a href="/register" class="btn btn-primary">Регистрация</a>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <h2>Создать аккаунт</h2>
    <p class="auth-subtitle">Зарегистрируйтесь для доступа к Luminar</p>

    <div class="auth-tabs">
      <a href="/login" class="auth-tab">Вход</a>
      <a href="/register" class="auth-tab active">Регистрация</a>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label>Юзернейм</label>
        <input type="text" id="username" placeholder="3-16 символов, латиница/цифры" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="Минимум 6 символов" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Повтор пароля</label>
        <input type="password" id="password2" placeholder="••••••••" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary">Создать аккаунт</button>
      <div id="msg" class="error-msg"></div>
    </form>
  </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'error-msg';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  if (password !== password2) { msg.textContent = 'Пароли не совпадают'; return; }

  try {
    const r = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await r.json();
    if (r.ok) {
      localStorage.setItem('luminar_token', data.token);
      msg.className = 'success-msg';
      msg.textContent = 'Аккаунт создан!';
      setTimeout(() => location.href = '/buy', 600);
    } else {
      msg.textContent = data.error || 'Ошибка регистрации';
    }
  } catch (err) {
    msg.textContent = 'Ошибка сети';
  }
});
</script>

</body>
</html>
