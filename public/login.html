<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Luminar</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <span class="nav-logo-mark">L</span>
      Luminar
    </a>
    <nav class="nav-links">
      <a href="/">Главная</a>
      <a href="/buy">Тарифы</a>
    </nav>
    <div class="nav-actions">
      <a href="/login" class="btn btn-ghost btn-sm">Войти</a>
      <a href="/register" class="btn btn-white btn-sm">Регистрация</a>
    </div>
  </div>
</header>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Авторизация</h2>
    <p class="auth-subtitle">Войдите в свой аккаунт Luminar</p>

    <div class="auth-tabs">
      <a href="/login" class="auth-tab active">Вход</a>
      <a href="/register" class="auth-tab">Регистрация</a>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>Юзернейм</label>
        <input class="form-input" type="text" id="username" placeholder="Ваш логин" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-white btn-block">Войти</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  msg.textContent = '';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, source: 'web' })
    });
    const data = await r.json();
    if (r.ok) {
      localStorage.setItem('luminar_token', data.token);
      msg.className = 'msg msg-success';
      msg.textContent = 'Успешно! Перенаправление...';
      setTimeout(() => location.href = '/profile', 600);
    } else {
      msg.className = 'msg msg-error';
      msg.textContent = data.error || 'Ошибка входа';
    }
  } catch (err) {
    msg.className = 'msg msg-error';
    msg.textContent = 'Ошибка сети';
  }
});
</script>

</body>
</html>
