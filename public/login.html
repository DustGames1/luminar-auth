<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход — Luminar</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
  <a href="/" class="logo">Luminar</a>
  <div class="links">
    <a href="/">Главная</a>
    <a href="/buy">Купить</a>
  </div>
  <div class="auth-btns">
    <a href="/register" class="btn btn-primary">Регистрация</a>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <h2>Вход</h2>
    <p class="subtitle">Войдите в свой аккаунт Luminar</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Юзернейм</label>
        <input type="text" id="username" placeholder="Ваш логин" required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary">Войти</button>
      <div id="msg" class="error-msg"></div>
    </form>

    <div class="footer">
      Нет аккаунта? <a href="/register">Зарегистрироваться</a>
    </div>
  </div>
</div>

<script>
async function generateBrowserHWID() {
  const data = navigator.userAgent + navigator.language + screen.width + screen.height + (navigator.hardwareConcurrency || 4);
  const buf = new TextEncoder().encode(data);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'error-msg';
  msg.textContent = '';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const hwid = await generateBrowserHWID();

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, hwid })
    });
    const data = await r.json();
    if (r.ok) {
      localStorage.setItem('luminar_token', data.token);
      msg.className = 'success-msg';
      msg.textContent = 'Успешно! Перенаправление...';
      setTimeout(() => location.href = '/profile', 800);
    } else {
      msg.textContent = data.error || 'Ошибка входа';
    }
  } catch (err) {
    msg.textContent = 'Ошибка сети';
  }
});
</script>

</body>
</html>
