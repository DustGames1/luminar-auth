<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Luminar</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="/" class="topbar-logo"><span class="topbar-logo-icon">L</span> Luminar</a>
    <nav class="topbar-nav">
      <a href="/">Главная</a>
      <a href="/buy">Тарифы</a>
    </nav>
    <div class="topbar-right">
      <a href="/register" class="btn btn-fill btn-sm">Регистрация</a>
    </div>
  </div>
</div>

<div class="auth-page">
  <div class="auth-box">
    <h2>Вход</h2>
    <p class="sub">Войдите в аккаунт Luminar</p>

    <div class="auth-switch">
      <a href="/login" class="on">Вход</a>
      <a href="/register">Регистрация</a>
    </div>

    <form id="loginForm">
      <div class="field">
        <label>Логин</label>
        <input type="text" id="username" placeholder="username" required autocomplete="username">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-fill btn-block btn-lg">Войти</button>
      <div id="msg" class="auth-msg"></div>
    </form>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'auth-msg'; msg.textContent = '';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, source: 'web' })
    });
    const data = await r.json();
    if (r.ok) {
      localStorage.setItem('luminar_token', data.token);
      msg.className = 'auth-msg ok'; msg.textContent = 'Успешно!';
      setTimeout(() => location.href = '/profile', 500);
    } else {
      msg.className = 'auth-msg err'; msg.textContent = data.error || 'Ошибка';
    }
  } catch { msg.className = 'auth-msg err'; msg.textContent = 'Ошибка сети'; }
});
</script>
</body>
</html>
