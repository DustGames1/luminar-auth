<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — LUMINAR</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="nav-line">
  <a href="/" class="brand">LUMINAR</a>
  <div class="links"><a href="/">Home</a><a href="/buy">Store</a></div>
  <div class="right"><a href="/register" class="btn btn-neon">Sign Up</a></div>
</div>

<div class="auth-full">
  <div class="auth-panel">
    <h2>LOGIN</h2>
    <p class="sub">Access your account</p>
    <div class="auth-tabs">
      <a href="/login" class="on">Login</a>
      <a href="/register">Register</a>
    </div>
    <form id="f">
      <div class="inp-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="your_login" required autocomplete="username">
      </div>
      <div class="inp-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-neon btn-block btn-lg">Enter</button>
      <div id="msg" class="auth-msg"></div>
    </form>
  </div>
</div>

<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'auth-msg'; msg.textContent = '';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  try {
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password,source:'web'}) });
    const d = await r.json();
    if (r.ok) { localStorage.setItem('luminar_token',d.token); msg.className='auth-msg ok'; msg.textContent='OK'; setTimeout(()=>location.href='/profile',400); }
    else { msg.className='auth-msg err'; msg.textContent=d.error||'Error'; }
  } catch { msg.className='auth-msg err'; msg.textContent='Network error'; }
});
</script>
</body>
</html>
