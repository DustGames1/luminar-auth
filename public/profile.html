<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профиль — Luminar</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="/" class="topbar-logo"><span class="topbar-logo-icon">L</span> Luminar</a>
    <nav class="topbar-nav">
      <a href="/">Главная</a>
      <a href="/buy">Тарифы</a>
    </nav>
    <div class="topbar-right">
      <a href="/profile" class="btn btn-fill btn-sm" id="navUser">Профиль</a>
    </div>
  </div>
</div>

<div class="dash">
  <!-- Sidebar -->
  <div class="dash-side">
    <div class="user-pill">
      <img id="avatar" src="" alt="">
      <div>
        <div class="uname" id="username">...</div>
        <div class="umeta" id="uidLine"></div>
        <div class="usub" id="subText">Загрузка...</div>
      </div>
      <button class="logout-ico" onclick="logout()" title="Выйти">⏻</button>
    </div>
    <button class="side-action side-action-primary" onclick="window.open('https://t.me/offersheart','_blank')">Поддержка</button>
    <a id="adminBtn" href="/admin" class="side-action side-action-ghost" style="display:none;">Admin Panel</a>
  </div>

  <!-- Main -->
  <div>
    <div class="dash-tabs">
      <div class="dash-tab active" data-tab="account">Аккаунт</div>
      <div class="dash-tab" data-tab="settings">Настройки</div>
      <div class="dash-tab" data-tab="launcher">Лаунчер</div>
    </div>

    <div class="dash-panel">
      <!-- Account -->
      <div id="tab-account">
        <div class="info-cells">
          <div class="info-cell">
            <div class="ic-label">Регистрация</div>
            <div class="ic-val" id="regDate">—</div>
          </div>
          <div class="info-cell">
            <div class="ic-label">UID</div>
            <div class="ic-val" id="uidVal">—</div>
          </div>
          <div class="info-cell">
            <div class="ic-label">HWID</div>
            <div class="ic-val" id="hwidVal">—</div>
          </div>
        </div>
        <div class="key-row">
          <input type="text" id="licenseKey" placeholder="XXXX-XXXX-XXXX-XXXX">
          <button class="btn btn-fill btn-sm" onclick="activate()">Активировать</button>
        </div>
        <div id="activateMsg" class="auth-msg"></div>
      </div>

      <!-- Settings -->
      <div id="tab-settings" class="hidden">
        <div class="set-block">
          <h4>Аватарка</h4>
          <div class="set-row">
            <input type="text" id="avatarUrl" placeholder="https://i.imgur.com/...">
            <button class="btn btn-fill btn-sm" onclick="updateAvatar()">Сохранить</button>
          </div>
          <div id="avatarMsg" class="auth-msg"></div>
        </div>
        <div class="set-block">
          <h4>Безопасность</h4>
          <button class="btn btn-outline btn-sm" onclick="alert('Скоро')">2FA Telegram</button>
        </div>
      </div>

      <!-- Launcher -->
      <div id="tab-launcher" class="hidden">
        <div class="info-cells">
          <div class="info-cell">
            <div class="ic-label">ОС</div>
            <div class="ic-val">Windows x64</div>
          </div>
          <div class="info-cell">
            <div class="ic-label">RAM</div>
            <div class="ic-val">4 GB min</div>
          </div>
          <div class="info-cell">
            <div class="ic-label">GPU</div>
            <div class="ic-val">Any</div>
          </div>
        </div>
        <div style="display:grid; grid-template-columns:1fr auto; gap:8px; align-items:stretch;">
          <div class="info-cell" style="margin:0;">
            <div class="ic-label">Версия</div>
            <div class="ic-val mono" id="versionVal">—</div>
          </div>
          <button class="btn btn-fill" onclick="downloadLoader()" style="padding:14px 24px; border-radius:12px;">Скачать</button>
        </div>
        <div id="downloadMsg" class="auth-msg" style="text-align:right;"></div>
      </div>
    </div>
  </div>
</div>

<footer class="ft">
  <div class="ft-bottom">
    <span>© 2026 Luminar</span>
    <span>by <strong style="color:var(--white);">DustGames</strong></span>
  </div>
</footer>

<script>
const token = localStorage.getItem('luminar_token');
if (!token) location.href = '/login';

let userData = null;

async function loadProfile() {
  const r = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
  if (!r.ok) { localStorage.removeItem('luminar_token'); location.href = '/login'; return; }
  const data = await r.json();
  userData = data.user;
  const u = userData;

  document.getElementById('username').textContent = u.username;
  document.getElementById('navUser').textContent = u.username;
  document.getElementById('uidLine').textContent = `#${u.id}${u.role ? ' · ' + u.role : ''}`;
  document.getElementById('uidVal').textContent = u.id;
  document.getElementById('regDate').textContent = new Date(Number(u.created_at)).toLocaleDateString();

  if ((u.username && u.username.toLowerCase() === 'dustgames') || (u.role && u.role.toLowerCase() === 'admin'))
    document.getElementById('adminBtn').style.display = 'flex';

  document.getElementById('avatar').src = u.avatar_url || `https://api.dicebear.com/7.x/identicon/svg?seed=${u.username}`;
  if (u.avatar_url) document.getElementById('avatarUrl').value = u.avatar_url;

  const hv = document.getElementById('hwidVal');
  if (u.hwid) { hv.textContent = 'Привязан'; hv.style.color = 'var(--green)'; }
  else { hv.textContent = 'Нет'; hv.style.color = 'var(--red)'; }

  const sub = u.subscription;
  const st = document.getElementById('subText');
  if (sub.active) st.innerHTML = `До: <span class="c-green">${new Date(Number(sub.until)).toLocaleDateString()}</span>`;
  else st.innerHTML = '<span class="c-red">Нет подписки</span>';

  fetch('/api/version').then(r=>r.text()).then(v=>{ document.getElementById('versionVal').textContent = v; });
}

document.querySelectorAll('.dash-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.dash-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('[id^="tab-"]').forEach(t => t.classList.add('hidden'));
    document.getElementById('tab-' + tab.dataset.tab).classList.remove('hidden');
  });
});

async function updateAvatar() {
  const url = document.getElementById('avatarUrl').value.trim();
  const msg = document.getElementById('avatarMsg');
  if (!url) { msg.className = 'auth-msg err'; msg.textContent = 'Введите URL'; return; }
  const r = await fetch('/api/me/avatar', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body:JSON.stringify({avatar_url:url}) });
  if (r.ok) { msg.className='auth-msg ok'; msg.textContent='Сохранено'; document.getElementById('avatar').src=url; }
  else { const d=await r.json(); msg.className='auth-msg err'; msg.textContent=d.error||'Ошибка'; }
}

async function activate() {
  const key = document.getElementById('licenseKey').value.trim();
  const msg = document.getElementById('activateMsg');
  if (!key) { msg.className='auth-msg err'; msg.textContent='Введите ключ'; return; }
  const r = await fetch('/api/me/activate', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body:JSON.stringify({key}) });
  const d = await r.json();
  if (r.ok) { msg.className='auth-msg ok'; msg.textContent='+ '+d.days+' дней'; document.getElementById('licenseKey').value=''; setTimeout(loadProfile,600); }
  else { msg.className='auth-msg err'; msg.textContent=d.error||'Ошибка'; }
}

function downloadLoader() {
  const msg = document.getElementById('downloadMsg');
  if (!userData||!userData.subscription||!userData.subscription.active) { msg.className='auth-msg err'; msg.textContent='Нужна подписка'; setTimeout(()=>location.href='/buy',1200); return; }
  msg.className='auth-msg ok'; msg.textContent='Загрузка...';
  window.location.href='/api/download/loader?token='+encodeURIComponent(token);
}

function logout() { localStorage.removeItem('luminar_token'); location.href='/'; }
loadProfile();
</script>
</body>
</html>
