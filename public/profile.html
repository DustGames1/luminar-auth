<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile — Luminar</title><link rel="stylesheet" href="/style.css"></head>
<body>
<nav class="nav">
  <a href="/" class="nav-brand"><img src="https://i.imgur.com/sck3Bpf.png" class="nav-brand-icon" alt="L"> Luminar</a>
  <div class="nav-center"><a href="/">Home</a><a href="/buy">Products</a></div>
  <div class="nav-right"><button class="theme-toggle" onclick="toggleTheme()">🌙</button><a href="/profile" class="btn btn-purple" id="navUser">Profile</a></div>
</nav>

<div class="profile-layout">
  <!-- Left -->
  <div class="profile-left">
    <div class="user-card">
      <img id="avatar" src="" alt="">
      <div><div class="user-name" id="username">... <span id="uidSpan"></span></div><div class="user-sub" id="subText">Loading...</div></div>
      <button class="copy-icon" onclick="logout()" title="Logout">⏻</button>
    </div>
    <div class="activate-card">
      <label>Activate License-Key</label>
      <div class="activate-row">
        <input type="text" id="licenseKey" placeholder="🔑 Enter key...">
        <button class="btn btn-purple" onclick="activate()">● Activate</button>
      </div>
      <div id="activateMsg" class="form-msg"></div>
    </div>
    <a id="adminBtn" href="/admin" class="btn btn-dark btn-block" style="display:none;">⚙ Admin Panel</a>
  </div>

  <!-- Right -->
  <div class="profile-right">
    <div class="profile-tabs">
      <div class="profile-tab active" data-tab="account">👤 Account</div>
      <div class="profile-tab" data-tab="settings">⚙ Settings</div>
      <div class="profile-tab" data-tab="launcher">📦 Launcher</div>
    </div>

    <!-- Account -->
    <div id="tab-account">
      <div class="profile-info">
        <div class="info-card"><div class="ic-label">Registration</div><div class="ic-value" id="regDate">—</div></div>
        <div class="info-card"><div class="ic-label">UID</div><div class="ic-value" id="uidVal">—</div></div>
        <div class="info-card"><div class="ic-label">Hwid</div><div class="ic-value" id="hwidVal">—</div></div>
      </div>
    </div>

    <!-- Settings -->
    <div id="tab-settings" class="hidden">
      <div class="activate-card">
        <label>Avatar URL</label>
        <div class="activate-row">
          <input type="text" id="avatarUrl" placeholder="https://...">
          <button class="btn btn-purple" onclick="updateAvatar()">Save</button>
        </div>
        <div id="avatarMsg" class="form-msg"></div>
      </div>
    </div>

    <!-- Launcher -->
    <div id="tab-launcher" class="hidden">
      <div class="profile-info">
        <div class="info-card"><div class="ic-label">OS</div><div class="ic-value">Windows x64</div></div>
        <div class="info-card"><div class="ic-label">Version</div><div class="ic-value" id="versionVal">—</div></div>
        <div class="info-card"><div class="ic-label">Status</div><div class="ic-value" style="color:var(--green)">Online</div></div>
      </div>
      <div style="margin-top:12px;"><button class="btn btn-purple btn-block btn-lg" onclick="downloadLoader()">📥 Download Loader</button></div>
      <div id="downloadMsg" class="form-msg"></div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-grid">
    <div class="footer-col"><h4>📄 Pages</h4><a href="/">Home</a><a href="/buy">Products</a></div>
    <div class="footer-col"><h4>💬 Communicate</h4><a href="https://t.me/offersheart">Telegram</a></div>
    <div class="footer-col"><h4>🔐 Account</h4><a href="#" onclick="logout()">Logout</a></div>
  </div>
  <div class="footer-bottom"><span>© Luminar, 2026</span><span>All Rights Reserved</span></div>
</footer>

<script>
function toggleTheme(){const t=document.documentElement;t.dataset.theme=t.dataset.theme==='light'?'':'light';localStorage.setItem('theme',t.dataset.theme);document.querySelector('.theme-toggle').textContent=t.dataset.theme==='light'?'☀️':'🌙';}
if(localStorage.getItem('theme')==='light'){document.documentElement.dataset.theme='light';document.querySelector('.theme-toggle').textContent='☀️';}

const token=localStorage.getItem('luminar_token');if(!token)location.href='/login';let userData=null;
async function loadProfile(){const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+token}});if(!r.ok){localStorage.removeItem('luminar_token');location.href='/login';return;}const data=await r.json();userData=data.user;const u=userData;
document.getElementById('username').innerHTML=u.username+' <span style="color:var(--text-3)">['+u.id+']</span>';
document.getElementById('navUser').textContent=u.username;document.getElementById('uidVal').textContent=u.id;
document.getElementById('regDate').textContent=new Date(Number(u.created_at)).toLocaleDateString();
if((u.username&&u.username.toLowerCase()==='dustgames')||(u.role&&u.role.toLowerCase()==='admin'))document.getElementById('adminBtn').style.display='flex';
document.getElementById('avatar').src=u.avatar_url||`https://api.dicebear.com/7.x/identicon/svg?seed=${u.username}`;
if(u.avatar_url)document.getElementById('avatarUrl').value=u.avatar_url;
const hv=document.getElementById('hwidVal');if(u.hwid){hv.textContent='Linked';hv.style.color='var(--green)';}else{hv.textContent='Not linked';hv.style.color='var(--red)';}
const sub=u.subscription,st=document.getElementById('subText');
if(sub.active)st.textContent='Subscription Till: '+new Date(Number(sub.until)).toLocaleDateString();else st.textContent='No subscription';
fetch('/api/version').then(r=>r.text()).then(v=>{document.getElementById('versionVal').textContent=v;});}

document.querySelectorAll('.profile-tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.profile-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');document.querySelectorAll('[id^="tab-"]').forEach(t=>t.classList.add('hidden'));document.getElementById('tab-'+tab.dataset.tab).classList.remove('hidden');});});

async function updateAvatar(){const url=document.getElementById('avatarUrl').value.trim(),msg=document.getElementById('avatarMsg');if(!url){msg.className='form-msg err';msg.textContent='Enter URL';return;}const r=await fetch('/api/me/avatar',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({avatar_url:url})});if(r.ok){msg.className='form-msg ok';msg.textContent='Saved!';document.getElementById('avatar').src=url;}else{const d=await r.json();msg.className='form-msg err';msg.textContent=d.error||'Error';}}
async function activate(){const key=document.getElementById('licenseKey').value.trim(),msg=document.getElementById('activateMsg');if(!key){msg.className='form-msg err';msg.textContent='Enter key';return;}const r=await fetch('/api/me/activate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({key})});const d=await r.json();if(r.ok){msg.className='form-msg ok';msg.textContent='+'+d.days+' days!';document.getElementById('licenseKey').value='';setTimeout(loadProfile,500);}else{msg.className='form-msg err';msg.textContent=d.error||'Error';}}
function downloadLoader(){const msg=document.getElementById('downloadMsg');if(!userData||!userData.subscription||!userData.subscription.active){msg.className='form-msg err';msg.textContent='Need subscription';setTimeout(()=>location.href='/buy',1200);return;}msg.className='form-msg ok';msg.textContent='Starting...';window.location.href='/api/download/loader?token='+encodeURIComponent(token);}
function logout(){localStorage.removeItem('luminar_token');location.href='/';}
loadProfile();
</script>
</body></html>
