services:
  - type: web
    name: luminar-auth
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: NODE_VERSION
        value: 20
    disk:
      name: auth-data
      mountPath: /opt/render/project/src
      sizeGB: 1
